# Runs the same checks as scripts/check on every push and pull request.
# This is the gate that also applies to cloud sessions, where Claude Code
# hooks do not run.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Third-party, but the standard way to get Nix on GitHub runners
      # (nixpkgs' own CI uses it). There is no official NixOS action.
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: scripts/check
